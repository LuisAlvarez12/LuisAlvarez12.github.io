<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Step-by-step guides and answers for every feature.">
    <title>Docs — Rezonating Apps</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="stylesheet" href="css/docs.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="docs-body">
    <!-- Top bar: brand, search, language. Populated by js/docs-page.js -->
    <header class="docs-topbar">
        <div class="docs-topbar-inner">
            <button class="docs-menu-button" id="docs-menu-button" type="button" aria-controls="docs-sidebar" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
                <span id="docs-menu-label">Features</span>
            </button>
            <a class="docs-brand" id="docs-brand" href="#">
                <img class="docs-brand-icon" id="docs-brand-icon" src="" alt="">
                <span class="docs-brand-text" id="docs-brand-text">Docs</span>
            </a>
            <div class="docs-topbar-actions">
                <a class="docs-back-link" id="docs-back-link" href="index.html">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    <span id="docs-back-label">Back</span>
                </a>
                <div class="docs-lang" id="docs-lang">
                    <button class="docs-lang-button" id="docs-lang-button" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span class="docs-lang-flag" id="docs-lang-flag" aria-hidden="true"></span>
                        <span class="docs-lang-name" id="docs-lang-name"></span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <ul class="docs-lang-menu" id="docs-lang-menu" role="listbox" hidden></ul>
                </div>
            </div>
        </div>
    </header>

    <div class="docs-layout">
        <div class="docs-sidebar-scrim" id="docs-sidebar-scrim" hidden></div>
        <aside class="docs-sidebar" id="docs-sidebar" aria-label="Features">
            <div class="docs-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
                <input type="search" id="docs-search-input" autocomplete="off" spellcheck="false">
                <kbd class="docs-search-kbd" aria-hidden="true">/</kbd>
            </div>
            <nav class="docs-nav" id="docs-nav"></nav>
        </aside>

        <main class="docs-main" id="docs-main" tabindex="-1">
            <div class="docs-loading" id="docs-loading" aria-live="polite"></div>
        </main>
    </div>

    <script src="js/platforms.js"></script>
    <script src="js/docs-page.js?v=2"></script>
</body>
</html>
